name: Repository audit

on: pull_request

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit proposed merge tree
        run: python3 maintenance/check_repository.py --commit "$GITHUB_SHA"
      - name: Test snapshot audit
        run: python3 -m unittest discover -s tests -p test_repository_audit.py
